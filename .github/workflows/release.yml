name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  npm_config_cache: ${{ github.workspace }}/.cache/npm
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
  desktop:
    needs: validate
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libudev-dev pkg-config
      - name: Package desktop and web
        run: |
          make package-desktop package-web
          tar -C build/packages/web -czf "build/packages/web/cordial-web-$CORDIAL_VERSION.tar.gz" "cordial-web-$CORDIAL_VERSION"
          python3 tools/check_release_archive.py "desktop/dist/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz" desktop "$CORDIAL_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            build/packages/web/*.tar.gz
          compression-level: 0
          if-no-files-found: error
  desktop-platforms:
    needs: validate
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: windows-x64
          - runner: macos-15
            artifact: macos-arm64
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --include=dev
          node node_modules/electron/install.js
      - name: Build unsigned package
        run: npm run package
      - name: Check macOS disk image
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/cordial-dmg"
          hdiutil attach dist/*.dmg -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          test -x "$mount/Cordial.app/Contents/MacOS/Cordial"
      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/cordial-desktop-*-windows-x64.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Cordial'
          $startup = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $login = "`"$destination\cordial-desktop.exe`" --hidden"
          foreach ($attempt in 1..2) {
            $result = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$destination" -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)" }
            if ($attempt -eq 1) {
              New-Item -Path $startup -Force | Out-Null
              New-ItemProperty -Path $startup -Name 'dev.petris.cordial' -Value $login -Force | Out-Null
            } elseif ((Get-ItemPropertyValue -Path $startup -Name 'dev.petris.cordial') -ne $login) {
              throw 'Reinstallation changed the login item'
            }
          }
          "CORDIAL_EXECUTABLE=$destination\cordial-desktop.exe" >> $env:GITHUB_ENV
      - name: Uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Split-Path $env:CORDIAL_EXECUTABLE
          $startup = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $result = Start-Process -FilePath "$destination/Uninstall cordial-desktop.exe" -ArgumentList '/S', "_?=$destination" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)" }
          if (Test-Path $env:CORDIAL_EXECUTABLE) { throw 'Uninstaller left the application executable' }
          if (Get-ItemProperty -Path $startup -Name 'dev.petris.cordial' -ErrorAction SilentlyContinue) { throw 'Uninstaller left the login item' }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          compression-level: 0
          if-no-files-found: error
  arch:
    needs: [validate, desktop]
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: portable
      - name: Build and check native package
        run: |
          make package-desktop-arch DESKTOP_ARCHIVE="desktop/dist/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz"
          docker run --rm -v "$PWD:/src" -w /src -e CORDIAL_VERSION archlinux:base-devel packaging/check-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: release/
          compression-level: 0
          if-no-files-found: error
  debian:
    needs: [validate, desktop]
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      DEB_DISTRIBUTION: ${{ matrix.distribution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            distribution: trixie
          - image: ubuntu:24.04
            distribution: noble
          - image: ubuntu:26.04
            distribution: resolute
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: portable
      - name: Build and check native package
        run: |
          make package-desktop-deb DESKTOP_ARCHIVE="desktop/dist/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz"
          docker run --rm -v "$PWD:/src" -w /src -e CORDIAL_VERSION -e DEB_DISTRIBUTION '${{ matrix.image }}' packaging/check-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distribution }}
          path: release/
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [validate, desktop, desktop-platforms, arch, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release packages and checksums
        shell: bash
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS-arch SHA256SUMS-trixie SHA256SUMS-noble SHA256SUMS-resolute)
          mkdir release
          cp "artifacts/desktop/dist/cordial-desktop-$CORDIAL_VERSION-x86_64.AppImage" release/
          cp "artifacts/desktop/dist/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz" release/
          cp "artifacts/build/packages/web/cordial-web-$CORDIAL_VERSION.tar.gz" release/
          cp "artifacts/cordial-desktop-$CORDIAL_VERSION-1-x86_64.pkg.tar.zst" release/
          for distribution in trixie noble resolute; do
            cp "artifacts/cordial-desktop_${CORDIAL_VERSION}-1~${distribution}_amd64.deb" release/
          done
          cp "artifacts/cordial-desktop-$CORDIAL_VERSION-windows-x64.exe" release/
          cp "artifacts/cordial-desktop-$CORDIAL_VERSION-macos-arm64.dmg" release/
          cd release
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes release/*
          gh release edit "$RELEASE_TAG" --draft=false
